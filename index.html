<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fb;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{width:min(92vw,650px);padding:36px;background:#fff;border:1px solid #e6e9ef;border-radius:24px;box-shadow:0 16px 50px #1118270d}h1{margin:0 0 12px;font-size:30px}p{color:#667085;line-height:1.5}.links{display:grid;gap:10px;margin-top:24px}a{display:block;padding:15px 18px;border:1px solid #e6e9ef;border-radius:12px;color:#111827;text-decoration:none;font-weight:700}a:hover,a:focus-visible{background:#f6f8fb;border-color:#7c8fa8}small{display:block;color:#667085;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<main class="loading">
<h1>Choose your challenge.</h1>
<p id="status" role="status">Loading your game menu…</p>
<div class="links">
<a href="/scorex/">＝ ScoreX →</a>
<a href="/morpheme-checker/">🔤 Morpheme Checker →</a>
<a href="/portal-source.html">Open the existing game portal →</a>
</div>
<small>You can open a game directly while the full menu loads.</small>
<noscript><p>JavaScript is needed for the games. The existing portal link still lists every earlier game.</p></noscript>
</main>
<script>
(async function () {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const response = await fetch('/portal-source.html', {credentials:'omit', cache:'no-cache', signal:controller.signal});
    if (!response.ok) throw new Error('Portal source could not be loaded');
    const source = await response.text();
    const marker = "<a class=\"game\" href=\"/boss-chest/\"><div class=\"icon\">🔐</div><div class=\"copy\"><h3>Boss Chest</h3><p>Play classroom game</p></div><div class=\"arrow\">→</div></a>";
    const cards = "<a class=\"game\" href=\"/scorex/\"><div class=\"icon\">＝</div><div class=\"copy\"><h3>ScoreX</h3><p>Play classroom game</p></div><div class=\"arrow\">→</div></a><a class=\"game\" href=\"/morpheme-checker/\"><div class=\"icon\">🔤</div><div class=\"copy\"><h3>Morpheme Checker</h3><p>Build words and explore meanings</p></div><div class=\"arrow\">→</div></a>";
    if (source.split(marker).length !== 2 || source.includes('href="/scorex/"') || source.includes('href="/morpheme-checker/"')) {
      throw new Error('Portal source has changed');
    }
    const page = source.replace(marker, marker + cards);
    clearTimeout(timeout);
    document.open();
    document.write(page);
    document.close();
  } catch (error) {
    const status = document.getElementById('status');
    if (status) status.textContent = 'The full menu could not load. These links still open your games.';
  } finally {
    clearTimeout(timeout);
  }
})();
</script>
</body>
</html>
