span class="sub">Tap runes to build your answer</span>'}function nextQuestion(){qnum++;pot={1:0,10:0,100:0,1000:0};let d=$('difficulty').value,r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));if(d==='easy'){let N=r(21,99);model={mode:'build',N,answer:N,den:[10,1]}}else if(d==='medium'){let N=r(101,999);model={mode:'build',N,answer:N,den:[100,10,1]}}else if(d==='hard'){let missing=r(25,1400),start=r(0,700);model={mode:'gate',start,gate:start+missing,answer:missing,den:[1000,100,10,1]}}else{let missing=r(800,6500),start=r(500,3500);model={mode:'gate',start,gate:start+missing,answer:missing,den:[1000,100,10,1]}}$('question').innerHTML=model.mode==='build'?'Build <b>'+model.N+'</b> with rune blocks.':'The gate needs <b>'+model.gate+'</b>. It already has <b>'+model.start+'</b>. Build the missing value.';$('runes').innerHTML=model.den.map(d=>'<div class="rune"><img src="'+RUNE[d]+'"><div>'+d+'</div><button onclick="add('+d+',-1)">−</button><span class="count" id="c'+d+'">0</span><button onclick="add('+d+',1)">+</button></div>').join('');paint();$('msg').textContent='';startTimer()}function submitRune(){if(val()!==model.answer)return wrong('That forge is worth '+val());if(false){let s=std(model.N);if(Object.keys(s).every(d=>(pot[d]||0)===s[d]))return wrong('Correct value, but use a different form');}award()}</script></body></html>
