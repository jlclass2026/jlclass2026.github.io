<!doctype html><html lang="en"><meta charset="utf-8"><title>Shape Creature responsive QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}nav{padding:12px;display:flex;gap:10px;background:white}button{padding:8px 14px}iframe{display:block;border:0;width:1366px;height:768px}</style><nav><button id="shape">Shape Creature</button><button id="jim">Who’s Nicked Jim</button><button id="desktop">Laptop 1366 × 768</button><button id="mobile">Phone 390 × 844</button><button id="tablet">Tablet 768 × 1024</button><span id="size">1366 × 768</span></nav><iframe id="preview" title="Game under test" src="./"></iframe><script>document.getElementById('shape').onclick=()=>document.getElementById('preview').src='./';document.getElementById('jim').onclick=()=>document.getElementById('preview').src='/whos-nicked-jim/';for(const [id,w,h]of[['desktop',1366,768],['mobile',390,844],['tablet',768,1024]])document.getElementById(id).onclick=()=>{const f=document.getElementById('preview');f.style.width=w+'px';f.style.height=h+'px';document.getElementById('size').textContent=w+' × '+h}</script></html>
