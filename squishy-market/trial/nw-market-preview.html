<script>
/* Fictional local-only teaching prototype. Not authentication or a real NW save adapter. */
(function (root, factory) { const api = factory(); if (typeof module === 'object' && module.exports) module.exports = api; else root.MarketEngine = api; })(typeof globalThis !== 'undefined' ? globalThis : this, function factory(classId) {
'use strict';

const clone = x => JSON.parse(JSON.stringify(x));
const int = (x,max=Number.MAX_SAFE_INTEGER) => Number.isSafeInteger(x) && x >= 0 && x <= max;

const now = () => new Date().toISOString();

const uid = () => 'offer-' + (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+'-'+(++seq)+'-'+Math.random().toString(36).slice(2));
function seed() {
 return {classId:CLASS,revision:1,students:[
 {id:'moss',creature:'Mossback',name:'Alex',code:'1111',balance:800},
 {id:'tide',creature:'Tidewhisk',name:'Blair',code:'2222',balance:625},
 {id:'ember',creature:'Emberhorn',name:'Casey',code:'3333',balance:450},
 {id:'star',creature:'Starpaw',name:'Drew',code:'4444',balance:1000}],
 items:[['medusa','Starsteel Shark',0,'moss',240],['ghost','Glitter Princess',1,'moss',175],['sprite','Thunder Cube',2,'moss',310],['frankenstein','Harvest Bat',3,'tide',260],['jelly','Storm Puff',4,'tide',185],['dragon','Captain Banana',5,'tide',340],['medusa2','Starsteel Shark',0,'ember',225],['ghost2','Glitter Princess',1,'ember',150],['sprite2','Thunder Cube',2,'ember',280],['frankenstein2','Harvest Bat',3,'star',250],['jelly2','Storm Puff',4,'star',200],['dragon2','Captain Banana',5,'star',360]].map(([id,name,art,owner,price])=>({id,name,art,owner,price,version:1})),requests:[],log:[]};
}
function validate(state) {
 if(!state || state.classId!==CLASS || !int(state.revision) || !Array.isArray(state.students) || !Array.isArray(state.items) || !Array.isArray(state.requests) || !Array.isArray(state.log)) fail('This is not a valid sample market.');
 const ids = new Set();
 for(const s of state.students) { if(!s || typeof s.id!=='string' || ids.has(s.id) || !int(s.balance)) fail('Invalid individual bank or creature ID.'); ids.add(s.id); }
 const itemIds = new Set();
 for(const i of state.items) { if(!i || typeof i.id!=='string' || itemIds.has(i.id) || !ids.has(i.owner) || !int(i.price,99999) || !int(i.version)) fail('Invalid sample collection.'); itemIds.add(i.id); }
 const requestIds = new Set();
 for(const r of state.requests) { validateRequest(r,state); if(requestIds.has(r.id)) fail('Duplicate request ID.'); requestIds.add(r.id); }
 return true;
}
function student(state,id) { return state.students.find(x=>x.id===id) || fail('Unknown creature.'); }
function item(state,id) { return state.items.find(x=>x.id===id) || fail('Unknown squishy.'); }
function findRequest(state,id) { return state.requests.find(x=>x.id===id) || fail('Unknown offer.'); }
function validateRequest(r,state) {
 if(!r || typeof r!=='object' || Array.isArray(r)) fail('Malformed offer.');
 const keys=['id','classId','buyer','seller','targetId','kind','offeredId','price','listingVersion','offeredVersion','status','createdAt','resolvedAt','reason'];
 if(Object.keys(r).some(k=>!keys.includes(k))) fail('Unexpected offer fields.');

}
function request(state,input) {
 validate(state);
 if(!input || !['buy','swap'].includes(input.kind)) fail('Choose purchase or swap.');

 if(target.owner===buyer.id) fail('Choose another creature’s squishy.');
 if(state.requests.length>=MAX_REQUESTS) fail('The demo inbox is full. Reset the sample to try again.');
 let offered=null;
 if(input.kind==='swap') { offered=item(state,input.offeredId); if(offered.owner!==buyer.id) fail('You can only offer your own squishy.'); }
 else if(input.offeredId!==undefined && input.offeredId!==null) fail('A purchase cannot include a swap item.');
 if(input.kind==='buy' && buyer.balance<target.price) fail('Not enough JD for the listed price.');
 if(state.requests.some(r=>r.status==='pending' && r.buyer===buyer.id && r.targetId===target.id && r.kind===input.kind && r.offeredId===(offered?offered.id:null))) fail('That offer is already waiting for your teacher.');
 const r={id:uid(),classId:CLASS,buyer:buyer.id,seller:target.owner,targetId:target.id,kind:input.kind,offeredId:offered?offered.id:null,price:target.price,listingVersion:target.version,offeredVersion:offered?offered.version:null,status:'pending',createdAt:now()};

}
function approve(state,id) {

 if(r.status!=='pending') fail('This offer is already resolved or unavailable.');

 else { const offered=item(next,r.offeredId); offered.owner=r.seller; offered.version++; }
 target.owner=r.buyer; target.version++; nr.status='approved'; nr.resolvedAt=now(); next.revision++;
 next.log.push({requestId:r.id,kind:r.kind,buyer:r.buyer,seller:r.seller,targetId:r.targetId,offeredId:r.offeredId,price:r.price,at:nr.resolvedAt});

}

function exportRequests(state) { validate(state); return {format:FORMAT,classId:CLASS,requests:state.requests.filter(r=>r.status==='pending').map(clone)}; }
function immutable(r) { return JSON.stringify(['id','classId','buyer','seller','targetId','kind','offeredId','price','listingVersion','offeredVersion','createdAt'].map(k=>r[k])); }
function importRequests(state,payload) {
 validate(state);
 if(typeof payload==='string') {if(payload.length>500000) fail('Offer file is too large.'); try{payload=JSON.parse(payload);}catch(e){fail('Offer file is not valid JSON.');}}
 if(!payload || typeof payload!=='object' || Array.isArray(payload) || Object.keys(payload).some(k=>!['format','classId','requests'].includes(k)) || payload.format!==FORMAT || payload.classId!==CLASS || !Array.isArray(payload.requests) || payload.requests.length>MAX_REQUESTS) fail('Use a sample offers file from this market.');

}

});

</script>

(function(root,factory){const api=factory(typeof module==='object'?require('./engine.js'):root.MarketEngine);if(typeof module==='object')module.exports=api;else root.MarketExchange=api;})(globalThis,function(E){

function readCatalogue(input,previous,minimumRevision=0){const p=parse(input);base(p,'nw-market-catalogue',['revision','creatures','items','outcomes']);const seed=E.seed();if(!Number.isSafeInteger(p.revision)||p.revision<1||!Array.isArray(p.creatures)||p.creatures.length!==seed.students.length||!Array.isArray(p.items)||p.items.length!==seed.items.length||!Array.isArray(p.outcomes)||p.outcomes.length>500)fail('Invalid rehearsal catalogue.');if(p.revision<minimumRevision)fail('This catalogue is older than the current NW snapshot.');

<script>
/* NW_MARKET_REHEARSAL_V1: isolated fictional rehearsal, never reads student records. */
(function(root){'use strict';
root.NWMarketRehearsal={install(adapter){
const E=root.MarketEngine,X=root.MarketExchange;if(!E||!X)throw Error('Market engine and exchange are required.');let state=adapter.load()||E.seed(),busy=false;E.validate(state);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function download(name,p){const u=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function render(){box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:18px"><div><small>FICTIONAL DRESS REHEARSAL · OFFLINE AUTHORITY</small><h2>Squishy Market</h2></div><button data-close>Close</button></div><p>This separate practice ledger does not read or change real student collections or banks. Names below are fictional. Keep real saves offline.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button data-export>Export catalogue + receipts</button><button data-import>Import offer file</button><button data-reset>Reset fictional rehearsal</button></div><input data-file type="file" accept="application/json,.json" hidden><p data-message role="status" style="color:#9a382d"></p><p>Snapshot ${state.revision}. Import every device’s file. Listing changes require your review. A buy pays the listed price only; a swap exchanges one item each.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${state.students.map(s=>`<div style="padding:12px;background:#eaf0df;border-radius:12px"><strong>${esc(s.name)} · ${esc(s.creature)}</strong><p>${E.formatMoney(s.balance)} JD · ${state.items.filter(i=>i.owner===s.id).length} squishies</p></div>`).join('')}</div><h3>Offers (${state.requests.filter(r=>r.status==='pending').length} waiting)</h3>${state.requests.slice().reverse().map(r=>{const b=state.students.find(s=>s.id===r.buyer),s=state.students.find(s=>s.id===r.seller),t=state.items.find(i=>i.id===r.targetId),o=state.items.find(i=>i.id===r.offeredId);return`<section style="border:1px solid #bbcdb7;padding:15px;border-radius:12px;margin:10px 0"><strong>${esc(b.name)}</strong> ${r.kind==='buy'?`offers ${E.formatMoney(r.price)} JD`:`offers ${esc(o.name)}`} for <strong>${esc(s.name)}’s ${esc(t.name)}</strong><p>Status: ${esc(r.status)}${r.reason?' · '+esc(r.reason):''}</p>${r.status==='pending'?`<button data-approve="${esc(r.id)}">Approve</button> <button data-deny="${esc(r.id)}">Deny</button>`:''}</section>`}).join('')||'<p>No offers imported yet.</p>'}<p style="font-size:12px">Export the refreshed catalogue after decisions, then import it on each market device. Re-importing a receipt never transfers items again. Back up your NW save before imports.</p>`;
box.querySelector('[data-close]').onclick=()=>box.close();box.querySelector('[data-export]').onclick=()=>download('NW-Market-Fictional-Catalogue.json',X.catalogue(state));box.querySelector('[data-import]').onclick=()=>box.querySelector('[data-file]').click();box.querySelector('[data-reset]').onclick=async()=>{if(confirm('Reset only this fictional market ledger? Old rehearsal files will no longer be current. Real NW data is unchanged.')){await commit(next=>Object.assign(next,E.seed())).catch(()=>{});tell('Fictional ledger reset. Discard old rehearsal files and reset market browsers too.')}};
box.querySelector('[data-file]').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>500000)throw Error('File exceeds 500 KB.');const p=JSON.parse(await f.text()),test=JSON.parse(JSON.stringify(state)),preview=X.importOffers(test,p,false);if(preview.needsListingApproval){const details=preview.listings.map(l=>{const i=state.items.find(i=>i.id===l.itemId),s=state.students.find(s=>s.id===l.owner);return`${s.name}: ${i.name} → ${E.formatMoney(l.price)} JD`}).join('\n');if(!confirm('Review provisional listing prices before importing offers:\n\n'+details+'\n\nAccept these price updates? This does not approve any purchase or swap.')){tell('Import cancelled. No prices or offers changed.');return}}

</script>
