function undo(host){const before=clone(host.read()),entry=before.journal.at(-1);if(entry?.kind!=='nw-market')throw Error('Undo the later NW action first.');const next={...clone(before),students:clone(entry.before.students),settings:clone(entry.before.settings),journal:before.journal.slice(0,-1)};const m=next.settings[A.KEY],old=before.settings[A.KEY];if(m&&old)m.state.revision=Math.max(m.state.revision,old.state.revision)+1;if(next.settings[A.KEY])A.validate(next.students,next.settings);return persist(host,before,next);}
function change(host,label,fn){const before=clone(host.read()),next=clone(before);fn(next);if(next.settings[A.KEY])A.validate(next.students,next.settings);next.journal.push({kind:"nw-market",label,before:{students:before.students,settings:before.settings}});return persist(host,before,next);}
return{decide,undo,change};});

</script><script>
/* Actual class stays offline. No catalogue/public export or network functionality. */
(function(){'use strict';function install(){if(document.getElementById('nwActualMarketButton'))return;const menu=document.getElementById('locationsMenu');if(!menu)return;const A=NWMarketClass,T=NWMarketTransaction,copy=x=>JSON.parse(JSON.stringify(x)),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let panel=document.createElement('dialog');panel.style.cssText='width:min(960px,95vw);max-height:90vh;overflow:auto;padding:25px;background:#fffdf4;color:#173e30;border:0;border-radius:20px;font:16px system-ui';document.body.appendChild(panel);
const host={read:()=>({students:slimStudents(),settings:gameSettings,journal:actionJournal,other:{teams,bossState,ctf,warnings,pbsLockStreak,gameLockUntil,dockVisits,statsLog}}),write:x=>{students=x.students;students.forEach(s=>s.creature=Array(TIERS.length).fill(null));gameSettings=x.settings;actionJournal=x.journal;if(x.other){teams=x.other.teams;bossState=x.other.bossState;ctf=x.other.ctf;warnings=x.other.warnings;pbsLockStreak=x.other.pbsLockStreak;gameLockUntil=x.other.gameLockUntil;dockVisits=x.other.dockVisits;statsLog=x.other.statsLog;}},persist:()=>{if(actionDepth>0)throw Error('Finish the current action first.');return saveData();}};
const message=t=>{panel.querySelector('[data-message]').textContent=t};function action(fn){try{fn();syncUndoDisplays();draw();message('Saved locally in NW. No data was uploaded.')}catch(e){message('No change applied: '+e.message)}}
const originalUndo=undoLatestAction;undoLatestAction=function(){if(actionJournal.at(-1)?.kind==='nw-market'){try{T.undo(host);syncUndoDisplays();if(panel.open)draw()}catch(e){alert(e.message)}return;}if(!gameSettings[A.KEY])return originalUndo();const before=copy(host.read()),oldSave=saveData;try{saveData=()=>true;originalUndo();saveData=oldSave;A.validate(students,gameSettings);if(!saveData())throw Error('Undo could not be saved.');}catch(e){saveData=oldSave;host.write(before);syncUndoDisplays();alert('Undo was not applied: '+e.message)}finally{saveData=oldSave;}};
function model(){return gameSettings[A.KEY]}function describe(type){return typeof nwLabel==='function'?nwLabel(type):type}
function draw(){const m=model();panel.innerHTML=`<div style="display:flex;justify-content:space-between"><h2>Class Market · Offline</h2><button data-close>Close</button></div><p><strong>Actual class mode.</strong> Decisions here change current students’ individual JD banks and Squishy collections. The public website remains fictional. Nothing is uploaded or exported from this panel.</p><p>Keep a full backup. Saves containing traded discovery items require this updated NW version, not older versions.</p><button data-backup>Download full backup</button><p data-message role="status" style="color:#a33228"></p>${!m?'<button data-activate>Enable offline class market</button>':`<p>Revision ${m.state.revision}. ${m.state.requests.filter(r=>r.status==='pending').length} offers waiting.</p><button data-refresh>Refresh current holdings</button> <button data-import>Import class offer file</button><input data-file type="file" accept=".json,application/json" hidden><h3>Record an offer locally</h3><p>This is for a teacher recording an agreed student request in person. Purchase amount is fixed by the saved listing.</p><label>Buyer <select data-buyer>${m.participants.map(p=>`<option value="${escape(p.id)}">${escape(students.find(s=>s.id===p.studentId).name)}</option>`).join('')}</select></label> <label>Wanted Squishy <select data-target>${m.state.items.map(i=>`<option value="${escape(i.id)}">${escape(i.name)} · ${escape(m.state.students.find(s=>s.id===i.owner).name)} · ${i.listed===false?'not listed':(i.price/100).toFixed(2)+' JD'}</option>`).join('')}</select></label> <label>Offer <select data-kind><option value="buy">Exact-price purchase</option><option value="swap">One-for-one swap</option></select></label> <label>Swap item <select data-offered>${m.state.items.map(i=>`<option value="${escape(i.id)}">${escape(i.name)} · ${escape(m.state.students.find(s=>s.id===i.owner).name)}</option>`).join('')}</select></label> <button data-request>Record pending offer</button><h3>Saved listing prices</h3><p>Record the owner's requested sale price here. Changing a price invalidates earlier offers for it.</p>${m.state.items.map(i=>`<div style="margin:9px 0">${escape(i.name)} · ${escape(m.state.students.find(s=>s.id===i.owner).name)} <input data-price="${escape(i.id)}" type="number" min="0" max="999.99" step="0.01" value="${(i.price/100).toFixed(2)}"><button data-saveprice="${escape(i.id)}">Save price</button></div>`).join('')}<h3>Offers</h3>${m.state.requests.slice().reverse().map(r=>{const b=m.state.students.find(s=>s.id===r.buyer),s=m.state.students.find(s=>s.id===r.seller),i=m.state.items.find(i=>i.id===r.targetId),o=m.state.items.find(i=>i.id===r.offeredId);return`<section style="border:1px solid #bbcdb7;padding:14px;margin:10px 0;border-radius:12px"><strong>${escape(b.name)}</strong> offers ${r.kind==='buy'?(r.price/100).toFixed(2)+' JD':escape(o.name)} for ${escape(s.name)}’s ${escape(i.name)}. <strong>${escape(r.status)}</strong>${r.status==='pending'?`<p><button data-approve="${escape(r.id)}">Approve</button> <button data-deny="${escape(r.id)}">Deny</button></p>`:''}</section>`}).join('')||'<p>No offers yet.</p>'}`}`;
panel.querySelector('[data-close]').onclick=()=>panel.close();panel.querySelector('[data-backup]').onclick=()=>downloadGameSave();if(!m){panel.querySelector('[data-activate]').onclick=()=>{if(confirm('Enable a local market for this loaded class? No trades happen yet. Make a full backup first. No information will be uploaded.'))action(()=>T.change(host,'Enable offline market',next=>{next.settings[A.KEY]=A.activate(next.students,next.settings,describe)}))};return;}
panel.querySelector('[data-refresh]').onclick=()=>action(()=>T.change(host,'Refresh market holdings',next=>{next.settings=A.refresh(next.students,next.settings,describe)}));panel.querySelector('[data-import]').onclick=()=>panel.querySelector('[data-file]').click();panel.querySelector('[data-file]').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>500000)throw Error('Offer file exceeds500 KB.');const p=JSON.parse(await f.text());action(()=>T.change(host,'Import class offers',next=>{next.settings=A.importRequests(next.students,next.settings,p).settings}))}catch(err){message(err.message)}};
panel.querySelector('[data-request]').onclick=()=>action(()=>T.change(host,'Record class offer',next=>{const mm=next.settings[A.KEY],E=MarketEngine.create(mm.classId);mm.state.students.forEach(s=>s.balance=next.students.find(x=>x.id===mm.participants.find(p=>p.id===s.id).studentId).personalJDCents);const kind=panel.querySelector('[data-kind]').value;if(kind==='buy'&&mm.state.items.find(i=>i.id===panel.querySelector('[data-target]').value)?.listed===false)throw Error('Save the owner’s listing price first.');E.request(mm.state,{buyer:panel.querySelector('[data-buyer]').value,targetId:panel.querySelector('[data-target]').value,kind,...(kind==='swap'?{offeredId:panel.querySelector('[data-offered]').value}:{})})}));
panel.querySelectorAll('[data-saveprice]').forEach(b=>b.onclick=()=>{const value=panel.querySelector(`[data-price="${b.dataset.saveprice}"]`).value;if(!/^\d{1,3}(\.\d{1,2})?$/.test(value))return message('Enter0.00–999.99 JD, at most two decimals.');action(()=>T.change(host,'Change listing price',next=>{const mm=next.settings[A.KEY],i=mm.state.items.find(i=>i.id===b.dataset.saveprice);MarketEngine.create(mm.classId).updateListing(mm.state,i.owner,i.id,Math.round(Number(value)*100));if(i.listed===false){i.listed=true;mm.state.revision++}}))});panel.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{if(confirm('Approve this actual class trade? Confirm both students agree. Current ownership, pending discovery awards and individual JD will be checked again.'))action(()=>T.decide(host,b.dataset.approve,true))});panel.querySelectorAll('[data-deny]').forEach(b=>b.onclick=()=>action(()=>T.decide(host,b.dataset.deny,false)));
}
const button=document.createElement('button');button.id='nwActualMarketButton';button.textContent='🛍️ Class Market (offline)';button.onclick=()=>{closeHeaderMenus();try{if(model())A.validate(students,gameSettings);draw();panel.showModal()}catch(e){alert('Class market cannot open: '+e.message)}};menu.appendChild(button);
}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();})();

</script></body></html>
