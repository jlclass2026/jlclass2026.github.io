function keys(x,allowed){return x&&typeof x==='object'&&!Array.isArray(x)&&Object.keys(x).every(k=>allowed.includes(k));}

for(const l of payload.listings){if(!keys(l,['itemId','owner','price','baseVersion'])||!id(l.itemId)||!id(l.owner)||(l.price!==null&&!int(l.price,99999))||!int(l.baseVersion)||l.baseVersion<1)fail('Malformed proposed price.');party(m,l.owner);item(m,l.itemId);if(m.listings.some(x=>same(x.proposal,l)))continue;m.listings.push({id:uid('listing'),proposal:clone(l),status:'pending'});added++;}

function pendingAward(settings,s,type){return(settings.squishAdoptionLedger||[]).some(tx=>!(settings.squishDiscoverySkipped?.[tx.id]||[]).includes(s.id)&&(tx.awards||[]).some(a=>a.studentId===s.id&&a.squishId===type)&&!awards(s,type).some(a=>a.awardTxId===tx.id));}
function decide(ss,settings,rid,approve){validate(ss,settings);const students=clone(ss),next=clone(settings),m=model(next),r=m.requests.find(r=>r.id===rid);if(!r||r.status!=='pending')fail('This request is missing or already resolved.');if(!approve){r.status='denied';r.resolvedAt=new Date().toISOString();m.revision++;return{students,settings:next};}const p=problem(students,m,r);if(p)fail(p);const b=student(students,m,r.buyer),s=student(students,m,r.seller),t=item(m,r.targetId),o=r.kind==='swap'?item(m,r.offeredId):null,moves=[{i:t,from:r.seller,to:r.buyer}];if(o)moves.push({i:o,from:r.buyer,to:r.seller});for(const mv of moves)if(pendingAward(next,student(students,m,mv.to),mv.i.type))fail('A pending discovery award reserves this Squishy. Finish that award before trading.');

function listing(ss,settings,lid,approve){validate(ss,settings);const next=clone(settings),m=model(next),l=m.listings.find(x=>x.id===lid);if(!l||l.status!=='pending')fail('Price proposal already resolved.');const i=item(m,l.proposal.itemId);if(approve){student(ss,m,l.proposal.owner);if(i.owner!==l.proposal.owner||i.version!==l.proposal.baseVersion)fail('This proposed price is out of date.');i.price=l.proposal.price;i.version++;l.status='approved';}else l.status='denied';m.revision++;invalidate(ss,m);validate(ss,next);return next;}
function transferredOut(settings,studentId,type,world,txId){const m=settings?.[KEY];if(!m)return false;return m.items.some(i=>i.type===type&&i.origin.studentId===studentId&&i.origin.world===world&&i.origin.awardTxId===txId&&party(m,i.owner).studentId!==studentId);}
function acquired(settings,studentId,type){const m=settings?.[KEY];if(!m)return false;return m.items.some(i=>i.type===type&&i.origin.studentId!==studentId&&party(m,i.owner).studentId===studentId);}
function currentTypes(settings,studentId){const m=settings?.[KEY];if(!m)return null;const p=m.participants.find(p=>p.studentId===studentId);if(!p)return null;return m.items.filter(i=>i.owner===p.id).map(i=>i.type);}
