 if(typeof r.id!=='string' || !/^offer-[a-zA-Z0-9-]{5,100}$/.test(r.id) || r.classId!==CLASS || !['buy','swap'].includes(r.kind) || !['pending','approved','denied','stale'].includes(r.status) || typeof r.createdAt!=='string' || r.createdAt.length>40 || !Number.isFinite(Date.parse(r.createdAt))) fail('Malformed or wrong-class offer.');
 if(!state.students.some(s=>s.id===r.buyer) || !state.students.some(s=>s.id===r.seller) || r.buyer===r.seller || !state.items.some(i=>i.id===r.targetId) || !int(r.price,99999) || !int(r.listingVersion)) fail('Invalid offer parties or listing.');
 if(r.kind==='swap') { if(!state.items.some(i=>i.id===r.offeredId) || r.offeredId===r.targetId || !int(r.offeredVersion)) fail('Invalid swap item.'); }
 else if(r.offeredId!==null || r.offeredVersion!==null) fail('Purchase cannot include a swap item.');
 if(r.resolvedAt!==undefined && (typeof r.resolvedAt!=='string' || !Number.isFinite(Date.parse(r.resolvedAt)))) fail('Invalid resolution date.');
 if(r.reason!==undefined && (typeof r.reason!=='string' || r.reason.length>200)) fail('Invalid status reason.');
 return true;
}
function currentProblem(state,r) {
 const target=item(state,r.targetId), buyer=student(state,r.buyer), seller=student(state,r.seller);
 if(target.owner!==r.seller) return 'That squishy has a different owner now.';
 if(target.version!==r.listingVersion || target.price!==r.price) return 'The listing changed. Please make a new request.';
 if(r.kind==='buy') {
  if(buyer.balance<r.price) return 'Not enough JD in the buyer’s individual bank now.';
  if(!int(seller.balance+r.price)) return 'The receiving bank balance is too large.';
 } else { const offered=item(state,r.offeredId); if(offered.owner!==r.buyer || offered.version!==r.offeredVersion) return 'The offered squishy changed or has a different owner now.'; }
 return null;
}
function invalidate(state) {
 for(const r of state.requests) if(r.status==='pending') { const problem=currentProblem(state,r); if(problem) {r.status='stale';r.reason=problem;r.resolvedAt=now();} }
}
function updateListing(state,owner,itemId,price) {
 validate(state); student(state,owner); const i=item(state,itemId);
 if(i.owner!==owner) fail('Only this creature can change its listing.');
 if(!int(price,99999)) fail('Use a price from 0.00 to 999.99 JD, in whole hundredths.');
 if(i.price===price) return i;
 i.price=price; i.version++; state.revision++; invalidate(state); return i;
}
function request(state,input) {
 validate(state);
 if(!input || !['buy','swap'].includes(input.kind)) fail('Choose purchase or swap.');
 if(Object.keys(input).some(k=>!['buyer','targetId','kind','offeredId'].includes(k))) fail('Purchase requests must use the listed price, not a custom bid.');
 const buyer=student(state,input.buyer), target=item(state,input.targetId);
 if(target.owner===buyer.id) fail('Choose another creature’s squishy.');
 if(state.requests.length>=MAX_REQUESTS) fail('The demo inbox is full. Reset the sample to try again.');
 let offered=null;
 if(input.kind==='swap') { offered=item(state,input.offeredId); if(offered.owner!==buyer.id) fail('You can only offer your own squishy.'); }
 else if(input.offeredId!==undefined && input.offeredId!==null) fail('A purchase cannot include a swap item.');
 if(input.kind==='buy' && buyer.balance<target.price) fail('Not enough JD for the listed price.');
 if(state.requests.some(r=>r.status==='pending' && r.buyer===buyer.id && r.targetId===target.id && r.kind===input.kind && r.offeredId===(offered?offered.id:null))) fail('That offer is already waiting for your teacher.');
 const r={id:uid(),classId:CLASS,buyer:buyer.id,seller:target.owner,targetId:target.id,kind:input.kind,offeredId:offered?offered.id:null,price:target.price,listingVersion:target.version,offeredVersion:offered?offered.version:null,status:'pending',createdAt:now()};
 state.requests.push(r); state.revision++; return r;
}
function approve(state,id) {
 validate(state); const r=findRequest(state,id);
 if(r.status!=='pending') fail('This offer is already resolved or unavailable.');
 const problem=currentProblem(state,r); if(problem) fail(problem);
 const next=clone(state), nr=findRequest(next,id), target=item(next,r.targetId), buyer=student(next,r.buyer), seller=student(next,r.seller);
 if(r.kind==='buy') { buyer.balance-=r.price; seller.balance+=r.price; }
 else { const offered=item(next,r.offeredId); offered.owner=r.seller; offered.version++; }
 target.owner=r.buyer; target.version++; nr.status='approved'; nr.resolvedAt=now(); next.revision++;
 next.log.push({requestId:r.id,kind:r.kind,buyer:r.buyer,seller:r.seller,targetId:r.targetId,offeredId:r.offeredId,price:r.price,at:nr.resolvedAt});
 invalidate(next); validate(next);
 Object.assign(state,next); return findRequest(state,id);
}
function deny(state,id) { validate(state); const r=findRequest(state,id); if(r.status!=='pending') fail('This offer is already resolved or unavailable.');r.status='denied';r.resolvedAt=now();state.revision++;return r; }
function exportRequests(state) { validate(state); return {format:FORMAT,classId:CLASS,requests:state.requests.filter(r=>r.status==='pending').map(clone)}; }
function immutable(r) { return JSON.stringify(['id','classId','buyer','seller','targetId','kind','offeredId','price','listingVersion','offeredVersion','createdAt'].map(k=>r[k])); }
function importRequests(state,payload) {
 validate(state);
 if(typeof payload==='string') {if(payload.length>500000) fail('Offer file is too large.'); try{payload=JSON.parse(payload);}catch(e){fail('Offer file is not valid JSON.');}}
 if(!payload || typeof payload!=='object' || Array.isArray(payload) || Object.keys(payload).some(k=>!['format','classId','requests'].includes(k)) || payload.format!==FORMAT || payload.classId!==CLASS || !Array.isArray(payload.requests) || payload.requests.length>MAX_REQUESTS) fail('Use a sample offers file from this market.');
 const next=clone(state); let added=0,duplicates=0;
 for(const raw of payload.requests) {
  validateRequest(raw,next); if(raw.status!=='pending' || raw.resolvedAt!==undefined || raw.reason!==undefined) fail('Only unresolved requests can be imported.');
  const old=next.requests.find(r=>r.id===raw.id);
  if(old) {if(immutable(old)!==immutable(raw)) fail('A request ID conflicts with an existing offer.');duplicates++;continue;}
  if(next.requests.length>=MAX_REQUESTS) fail('The demo inbox is full.');
  // Distinct IDs must not be used to replay the same pending offer.
  if(next.requests.some(r=>r.status==='pending' && r.buyer===raw.buyer && r.targetId===raw.targetId && r.kind===raw.kind && r.offeredId===raw.offeredId && r.listingVersion===raw.listingVersion && r.offeredVersion===raw.offeredVersion)) fail('Duplicate offer with a different ID.');
  next.requests.push(clone(raw));added++;
 }
 invalidate(next);if(added)next.revision++;validate(next);Object.assign(state,next);return {added,duplicates};
}
return {seed,validate,updateListing,request,approve,deny,exportRequests,importRequests,currentProblem,formatMoney:c=>(c/100).toFixed(2),CLASS_ID:CLASS};
});
</script><script>'use strict';
const E=MarketEngine,KEY='squishy-market-v2-trial-1';let state=E.seed(),inbox=[],session=null,route='home',shop=null,mode='browse',drafts={},pendingAction=null;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(n/100).toFixed(2)+' JD',student=id=>state.students.find(s=>s.id===id),item=id=>state.items.find(x=>x.id===id),art=n=>ART[String(n%6)],avatar=id=>art([3,0,2,5][state.students.findIndex(s=>s.id===id)]),img=(n,alt,cl='')=>`<img class="${cl}" src="${art(n)}" alt="${esc(alt)}">`;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.state?.classId===state.classId&&Array.isArray(saved.state.items)&&Array.isArray(saved.inbox)){E.validate(saved.state);state=saved.state;inbox=saved.inbox.filter(id=>state.requests.some(r=>r.id===id))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,inbox}))}catch(e){toast('Browser storage is unavailable. Keep this tab open and export your offers.')}}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
function close(){if($('#modal').open)$('#modal').close();pendingAction=null}
function dialog(title,html){$('#modal').innerHTML=`<div class="dialogtop"><h2>${title}</h2><button class="close" aria-label="Close dialog" onclick="close()">×</button></div>${html}<div class="error" id="error" role="alert"></div>`;if(!$('#modal').open)$('#modal').showModal()}
function error(e){const el=$('#error');if(el)el.textContent=e.message||e;else toast(e.message||e)}
function go(r){if(mode==='edit'&&Object.keys(drafts).length&&!confirm('Leave without saving these price changes?'))return;close();route=r;mode='browse';drafts={};render();window.scrollTo(0,0)}
function header(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));$('#hero').innerHTML=route==='home'?`<section class="hero"><div><div class="eyebrow">The jungle exchange · Trial edition</div><h1>Little treasures.<br>Big possibilities.</h1><p>Find a creature’s shop. Discover a squishy you love. Offer the exact JD price or a squishy of your own.</p><span class="badge" style="background:#355b4a;color:#ebf5de">Every deal waits for your teacher</span></div><div class="hero-art">${img(0,'A sparkling shark squishy')}<div class="bubble">Buy it. Swap it. Request it.</div></div></section><div class="steps"><span><b>1</b>Choose a creature</span><span><b>2</b>Send an offer</span><span><b>3</b>Teacher decides</span></div>`:''}
function render(){header();const app=$('#app');if(route==='home'){app.innerHTML=`<div class="sectionhead"><div><div class="eyebrow muted">Pick a shop to explore</div><h2>Meet the traders</h2></div><span class="badge">${state.students.length} sample creatures</span></div><div class="grid">${state.students.map((s,i)=>`<button class="shopcard" onclick="chooseShop('${s.id}')"><div class="portrait"><img src="${avatar(s.id)}" alt="${esc(s.creature)} demo creature"></div><div class="cardbody"><div class="eyebrow muted">Creature shop ${i+1}</div><h3>${esc(s.creature)}</h3><div class="row"><span class="small muted">${state.items.filter(x=>x.owner===s.id).length} squishies to discover</span><span aria-hidden="true">↗</span></div></div></button>`).join('')}</div><div class="strip"><div><strong>Nothing changes hands when you click Submit.</strong><div class="small muted">Requests stay pending until a teacher imports and approves them.</div></div><button class="ghost" onclick="help()">Try the whole journey →</button></div>`}
else if(route==='shop')renderShop();else if(route==='requests')renderRequests();else if(route==='teacher')renderTeacher()}
function chooseShop(id){shop=id;const s=student(id);dialog('Is this your creature?',`<div style="text-align:center"><img src="${avatar(id)}" alt="${esc(s.creature)}" style="height:145px;max-width:100%"><h3>${esc(s.creature)}</h3></div><p class="muted">Visit the shop, or unlock the collection to set your prices.</p><div class="dialogactions"><button onclick="ownerLogin('${id}')">Yes, this is mine</button><button class="soft" onclick="openShop('${id}')">No, just browsing</button></div>`)}
function openShop(id,edit=false){close();route='shop';shop=id;mode=edit?'edit':'browse';drafts={};render();window.scrollTo(0,0)}
function ownerLogin(id){authenticate(id,()=>openShop(id,true))}
function authenticate(id,done){const s=student(id);dialog('Unlock '+esc(s.creature),`<p>Enter this creature’s private code.</p><label for="code">Demo access code</label><input id="code" inputmode="numeric" maxlength="4" autocomplete="off" style="width:100%" placeholder="4 digits"><p class="small muted">For this sample trial, the code is <strong>${esc(s.code)}</strong>. Real codes would not appear here or in public code.</p><div class="dialogactions"><button id="unlock">Unlock</button><button class="soft" onclick="close()">Cancel</button></div>`);$('#unlock').onclick=()=>{if($('#code').value!==String(s.code))return error('That code does not match. Try the demo code shown above.');session=id;close();done()};$('#code').onkeydown=e=>{if(e.key==='Enter')$('#unlock').click()};$('#code').focus()}
function renderShop(){const s=student(shop),owned=state.items.filter(x=>x.owner===shop),editing=mode==='edit';$('#app').innerHTML=`<button class="ghost crumb" onclick="go('home')">← All creature shops</button><div class="shopheading"><img src="${avatar(shop)}" alt="${esc(s.creature)}"><div><div class="eyebrow">${editing?'Your collection':'Welcome to the shop'}</div><h2>${esc(s.creature)}</h2><p>${editing?'Set a price. Save. Then explore.':'Choose something wonderful.'}</p></div>${editing?`<div class="balance">Your bank<br>${money(s.balance)}</div>`:'<span class="badge">Teacher-approved trades only</span>'}</div><div class="sectionhead" style="margin-top:28px"><h2>${editing?'Price your squishies':'The collection'}</h2>${editing?`<button class="gold" onclick="savePrices()">Save & exit</button>`:`<button class="ghost" onclick="ownerLogin('${shop}')">This is my creature</button>`}</div>${editing?'<p class="muted small">Set prices in JD, including cents. Saving prices never sells an item. Changes make earlier offers on that item unavailable.</p>':''}<div class="items">${owned.map(x=>`<article class="item">${img(x.art,x.name)}<h3>${esc(x.name)}</h3>${editing?`<label for="price-${x.id}">Selling price (JD)</label><input id="price-${x.id}" type="number" min="0" max="999.99" step="0.01" value="${(x.price/100).toFixed(2)}" oninput="drafts['${x.id}']=this.value">`:`<div class="price">${money(x.price)}</div><div class="row"><button onclick="startOffer('${x.id}','buy')">Request to buy</button><button class="soft" onclick="startOffer('${x.id}','swap')">Offer a swap</button></div>`}</article>`).join('')}</div>`}
function savePrices(){try{if(session!==shop)throw Error('Unlock your creature before editing prices.');const edits=Object.entries(drafts).map(([id,v])=>{if(!/^\d{1,3}(\.\d{1,2})?$/.test(v))throw Error('Use a price from 0.00 to 999.99 JD, with no more than two decimal places.');return [id,Math.round(Number(v)*100)]});edits.forEach(([id,v])=>{if(item(id)?.owner!==shop||!Number.isSafeInteger(v))throw Error('This collection changed. Please reopen it.')});edits.forEach(([id,v])=>{if(item(id).price!==v)E.updateListing(state,shop,id,v)});save();mode='browse';drafts={};render();toast('Prices saved. Your collection is ready to browse.')}catch(e){toast(e.message)}}
function startOffer(targetId,kind){const target=item(targetId);pendingAction={targetId,kind};dialog('Which creature are you?',`<p class="muted">Choose your own creature to ${kind==='buy'?'request this purchase':'offer one of your squishies'}.</p><div class="choices">${state.students.filter(s=>s.id!==target.owner).map(s=>`<button class="choice" onclick="offerIdentity('${s.id}','${targetId}','${kind}')"><img src="${avatar(s.id)}" alt=""><strong>${esc(s.creature)}</strong></button>`).join('')}</div>`)}
function offerIdentity(id,targetId,kind){authenticate(id,()=>confirmOffer(targetId,kind))}
function confirmOffer(targetId,kind){const t=item(targetId),s=student(session);if(!t||!s)return toast('Please choose your creature again.');if(kind==='buy'){dialog('Request this squishy?',`<div class="offerline">${img(t.art,t.name)}<div><h3>${esc(t.name)}</h3><div class="price">${money(t.price)}</div></div></div><div class="strip"><span>Your saved JD bank</span><strong>${money(s.balance)}</strong></div><p>The price is fixed. Your teacher will check and approve the deal before any JD or squishy moves.</p>${s.balance<t.price?'<div class="notice">Not enough JD for this item. You can offer a swap instead.</div>':''}<div class="dialogactions"><button id="submitOffer" ${s.balance<t.price?'disabled':''} onclick="submitOffer('${targetId}','buy')">Submit buy request</button><button class="soft" onclick="confirmOffer('${targetId}','swap')">Offer a swap</button></div>`)}else{const own=state.items.filter(x=>x.owner===session);dialog('Pick your swap',`<p>Offer one of your squishies for <strong>${esc(t.name)}</strong>. No JD is included.</p><div class="choices">${own.map(x=>`<button class="choice" onclick="swapConfirm('${targetId}','${x.id}')">${img(x.art,x.name)}<strong>${esc(x.name)}</strong></button>`).join('')}</div>${own.length?'':'<p>You have no squishies to offer.</p>'}<p class="small muted">Nothing moves until your teacher approves both sides.</p>`)}}
function swapConfirm(targetId,offeredId){const t=item(targetId),o=item(offeredId);dialog('Send this swap offer?',`<div class="choices"><div class="choice">${img(o.art,o.name)}<strong>You offer<br>${esc(o.name)}</strong></div><div class="choice">${img(t.art,t.name)}<strong>You request<br>${esc(t.name)}</strong></div></div><p>Your teacher checks the swap with both traders before approving. Submitting does not move either squishy.</p><div class="dialogactions"><button onclick="submitOffer('${targetId}','swap','${offeredId}')">Submit swap request</button><button class="soft" onclick="confirmOffer('${targetId}','swap')">Choose another</button></div>`)}
function submitOffer(targetId,kind,offeredId){try{E.request(state,{buyer:session,targetId,kind,offeredId});save();close();route='requests';render();toast('Request sent to the sample outbox. Nothing has moved.')}catch(e){error(e)}}
function requestCard(r,teacher=false){const t=item(r.targetId),o=item(r.offeredId),buyer=student(r.buyer),seller=student(r.seller);const names=teacher?`${buyer.name} → ${seller.name}`:`${buyer.creature} → ${seller.creature}`;return `<article class="offer"><div class="row spread"><span class="eyebrow muted">${esc(names)}</span><span class="status ${r.status}">${esc(r.status)}</span></div><div class="offerline">${img(t.art,t.name)}<div class="deal"><h3>${r.kind==='buy'?`Offers ${money(r.price)}`:`Offers ${esc(o.name)}`}</h3><p class="muted" style="margin-bottom:8px">for ${esc(t.name)}${r.kind==='swap'?' · one-for-one swap':''}</p><span class="small muted">${r.status==='pending'?'No JD or items have moved.':r.status==='approved'?'Both sides of the deal have been transferred.':r.status==='denied'?'Teacher declined. Nothing was transferred.':'This offer is no longer valid. Nothing was transferred.'}</span></div>${r.kind==='swap'?img(o.art,o.name):''}</div>${teacher&&r.status==='pending'?`<div class="row" style="margin-top:16px"><button class="lime" onclick="review('${r.id}')">Review & approve</button><button class="danger" onclick="decide('${r.id}',false)">Deny</button></div>`:''}</article>`}
function renderRequests(){if(!session){$('#app').innerHTML=`<h2>Your requests</h2><p>Unlock your creature to see its offers and saved JD bank.</p><div class="grid">${state.students.map(s=>`<button class="shopcard" onclick="requestLogin('${s.id}')"><div class="portrait"><img src="${avatar(s.id)}" alt=""></div><div class="cardbody"><h3>${esc(s.creature)}</h3></div></button>`).join('')}</div>`;return}const s=student(session),rs=state.requests.filter(r=>r.buyer===session);$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow muted">${esc(s.creature)}</div><h2>Your requests</h2></div><div class="balance">${money(s.balance)}</div></div><div class="row"><button class="ghost" onclick="session=null;render()">Switch creature</button><button class="soft" onclick="downloadOffers()">Export sample offers</button></div><div class="notice">Trial outbox only. To try the next step, open Teacher trial and import the sample offers. No requests are being sent online.</div>${rs.length?rs.slice().reverse().map(r=>requestCard(r)).join(''):'<div class="empty"><h3>Your next treasure is waiting.</h3><p>Visit a creature shop to make your first request.</p><button onclick="go(\'home\')">Browse shops</button></div>'}`}
function requestLogin(id){authenticate(id,()=>{route='requests';render()})}
function renderTeacher(){const rs=state.requests.filter(r=>inbox.includes(r.id));$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow muted">Offline NW workflow · simulated here</div><h2>The teacher’s trading desk</h2></div><span class="badge">${rs.filter(r=>r.status==='pending').length} awaiting review</span></div><p class="muted">The names below are fictional and appear only in this teacher-demo screen. In the real system, this screen and student names belong in offline NW, not the public market.</p><div class="teacherbar"><button class="gold" onclick="importOutbox()">Import sample offers</button><button class="ghost" onclick="$('#importFile').click()">Import offers JSON</button><button class="ghost" onclick="downloadOffers()">Export offers JSON</button><button class="soft" onclick="downloadSnapshot()">Export refreshed demo snapshot</button></div><div class="notice">This trial simulates the teacher’s authoritative game on this same device. It is not connected to your NW save. Approving changes sample balances and collections only.</div>${rs.length?rs.slice().reverse().map(r=>requestCard(r,true)).join(''):'<div class="empty"><h3>No offers at the desk yet.</h3><p>Make a request in a creature shop, then use Import sample offers above.</p></div>'}<h2 style="margin-top:32px">Sample banks</h2><div class="grid">${state.students.map(s=>`<div class="panel"><div class="eyebrow muted">${esc(s.creature)}</div><h3>${esc(s.name)}</h3><div class="price">${money(s.balance)}</div><span class="small muted">${state.items.filter(x=>x.owner===s.id).length} squishies</span></div>`).join('')}</div><details class="history"><summary>Transaction record (${state.log.length})</summary><ul>${state.log.map(l=>`<li>${esc(JSON.stringify(l))}</li>`).join('')||'<li>No completed transactions yet.</li>'}</ul></details>`}
function importOutbox(){try{const p=E.exportRequests(state);const before=inbox.length;E.importRequests(state,p);p.requests.forEach(r=>{if(!inbox.includes(r.id))inbox.push(r.id)});save();render();toast(`${inbox.length-before} new offers imported. Existing offers were not duplicated.`)}catch(e){toast(e.message)}}
function review(id){const r=state.requests.find(r=>r.id===id);dialog('Approve this sample deal?',`<p><strong>${esc(student(r.buyer).name)}</strong> ${r.kind==='buy'?`pays ${money(r.price)} to`: 'swaps with'} <strong>${esc(student(r.seller).name)}</strong>.</p><p>${r.kind==='swap'?'Check that both children agree to this swap. ':''}Ownership and funds are checked again when you approve. Both sides move together, or neither moves.</p><div class="dialogactions"><button class="lime" onclick="decide('${id}',true)">Approve deal</button><button class="soft" onclick="close()">Not yet</button></div>`)}
function decide(id,yes){try{if(!inbox.includes(id))throw Error('Import this offer first.');yes?E.approve(state,id):E.deny(state,id);save();close();render();toast(yes?'Approved. Sample JD and squishies transferred together.':'Declined. No JD or squishies moved.')}catch(e){error(e);save();render()}}
function download(name,data){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function downloadOffers(){download('Squishy-Market-Sample-Offers.json',E.exportRequests(state));toast('Sample offers exported. Contains no student names or access codes.')}
function downloadSnapshot(){download('Squishy-Market-Refreshed-Demo.json',{schema:'squishy-market-demo-snapshot-v1',sampleOnly:true,classId:state.classId,revision:state.revision,creatures:state.students.map(({id,creature,balance})=>({id,creature,balance})),items:state.items,outcomes:state.requests.map(({id,status})=>({id,status}))});toast('Refreshed sample snapshot exported. This is not an NW import file.')}
$('#importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>1024*1024)throw Error('Offer files must be smaller than 1 MB.');const p=JSON.parse(await f.text());const result=E.importRequests(state,p);const rows=Array.isArray(p.requests)?p.requests:[];rows.forEach(r=>{if(state.requests.some(s=>s.id===r.id)&&!inbox.includes(r.id))inbox.push(r.id)});save();route='teacher';render();toast(`Imported ${result.added} new requests; ${result.duplicates} duplicates skipped.`)}catch(err){toast('Import rejected: '+err.message)}finally{e.target.value=''}};
function help(){dialog('Try the whole journey',`<ol style="padding-left:22px;line-height:1.8"><li>Choose a creature. Say “Yes” and use its visible demo code to set prices.</li><li>Browse a different shop. Request to buy at the exact price, or offer one of your squishies.</li><li>Choose your creature and enter its demo code. Submit. Nothing moves yet.</li><li>Open <strong>Teacher trial</strong> → <strong>Import sample offers</strong>.</li><li>Approve or deny. Check the updated collections and banks.</li></ol><p class="small muted">Codes and names are fictional. This prototype uses your browser only, not a shared online inbox. The classroom entry gate and real authentication will be separate from this trial.</p><div class="dialogactions"><button onclick="close()">Let’s try it</button><button class="danger" onclick="resetTrial()">Reset sample data</button></div>`)}
function resetTrial(){if(!confirm('Reset this trial’s sample prices, requests and completed trades? This does not affect NW.'))return;state=E.seed();inbox=[];session=null;save();close();route='home';render();toast('Fresh sample market ready.')}
$('#help').onclick=help;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('#modal').addEventListener('cancel',()=>pendingAction=null);render();
</script></body></html>
