range_triple_eye":"common","monsters_03_lavender_stardust":"rare","monsters_04_teal_watcher":"uncommon","monsters_05_golden_cyclops":"uncommon","monsters_06_pink_sparkle":"rare","monsters_07_blue_sprout":"common","monsters_08_peach_flop":"common","monsters_09_aqua_moonbeam":"legendary","monsters_10_mint_manyeyes":"uncommon","weather_01_sun":"common","weather_02_rain_cloud":"common","weather_03_thunderstorm":"uncommon","weather_04_snow":"uncommon","weather_05_rainbow_cloud":"legendary","weather_06_purple_wind":"uncommon","weather_07_mint_wind":"common","weather_08_gray_fog":"common","weather_09_hail":"rare","weather_10_frost":"rare","wild_things_bramblehorn":"common","wild_things_chestnut_chomper":"uncommon","wild_things_forest_grumbler":"common","wild_things_golden_beak":"rare","wild_things_max":"legendary","wild_things_mossy_mischief":"rare","wild_things_rusty_rumpus":"common","wild_things_tawny_tumbler":"uncommon"});
function rarityBadge(i){const tier=RARITY_BY_TYPE[i?.type],name=RARITY_LABELS[tier]||'Rarity unavailable';return `<span class="rarity rarity-${tier||'unknown'}" aria-label="Rarity: ${name}">${name}</span>`}
function img(src,alt){return src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:''}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function persist(){} // Shared offers are authoritative; legacy local storage is preserved untouched.
function close(){if($('#modal').open)$('#modal').close()}
function dialog(title,body){$('#modal').innerHTML=`<div class="dialogtop"><h2>${esc(title)}</h2><button class="close" data-action="close" aria-label="Close dialog">×</button></div>${body}<p id="dialogError" class="error" role="alert"></p>`;if(!$('#modal').open)$('#modal').showModal()}
function problem(e){if(e.status===423)marketOpen=false;const target=$('#dialogError');const text=teacher?e.message:(e.code==='DUPLICATE_OFFER'?'You already sent that offer. Look in My offers.':e.status===401?'Please close and reopen the market to choose your creature again.':e.code==='OFFLINE'?'We could not reach the market. Please try again.':e.status===423?'The market is resting while your teacher checks the offers.':e.status===429?'Take a little pause, then try again.':e.status===409?'The market changed or is resting. Refresh your offers and try again.':'That offer is not ready yet. Check your choice or ask your teacher.');if($('#modal').open&&target)target.textContent=text;else toast(text)}
function checkKnown(c){for(const x of c.creatures)if(!creatureArt.has(x.creature))throw Error('New creature artwork is needed before loading this catalogue.')}
function status(r){return offerMeta.get(r.id)?.status||baseline.outcomes.find(o=>o.id===r.id)?.status||'pending'}
function validStored(r){try{E.requestShape(r);return !!(creature(r.buyer)&&creature(r.seller)&&item(r.targetId)&&(r.kind==='buy'||item(r.offeredId)))}catch(e){return false}}
async function load(){if(loadPromise)return loadPromise;loadPromise=(async()=>{const res=await fetch('../creature-gallery/collection.json',{cache:'no-store'});if(!res.ok)throw Error('Collections unavailable');const g=await res.json();baseline=E.gallery(g);for(const c of g.cards){if(/^assets\/[a-f0-9]{64}\.webp$/.test(c.art))creatureArt.set(c.creatureName,'../creature-gallery/'+c.art);for(const i of c.squishies)if(/^assets\/[a-f0-9]{64}\.webp$/.test(i.art))itemArt.set(i.id,{name:i.name,art:'../creature-gallery/'+i.art})}const config=await fetch('./market-service.json',{cache:'no-store'});if(!config.ok)throw Error('Market service unavailable');service=await config.json();const base=new URL(service.apiBase);if(base.protocol!=='https:'||new URL(service.teacherUrl).origin!==base.origin)throw Error('Invalid market configuration');api=MarketTransport.create(service.apiBase,()=>accessToken);const state=await api('/api/market');baseline=E.catalogue(state.catalogue);checkKnown(baseline);marketOpen=state.open===true;epoch=state.epoch;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.requests)){legacyRequests=saved.requests;drafts=saved.drafts||{}}}catch(e){}render()})().catch(e=>{loadPromise=null;$('#app').innerHTML='<section class="panel empty"><h2>The shops are resting</h2><p>Please try again in a moment or ask your teacher.</p><button data-action="retry">Try again</button></section>'});return loadPromise}
async function refreshOffers(){if(!accessToken)return;const selected=session;const state=await api('/api/market');const fresh=E.catalogue(state.catalogue,baseline);checkKnown(fresh);if(fresh.classId!==baseline.classId)throw Error('Class changed');baseline=fresh;if(!creature(selected)){newVisit();throw Error('Creature unavailable')}const result=await api('/api/offers');if(selected!==session)return;requests=[];offerMeta=new Map();for(const x of result.offers||[]){try{E.requestShape(x.request);if(x.request.buyer!==session)continue;requests.push(x.request);offerMeta.set(x.request.id,{status:x.status,exported:!!x.exported})}catch(e){}}marketOpen=result.open===true;epoch=result.epoch;}
async function enterIdentity(id){if(session||inFlight||!creature(id))return;const visit=visitEpoch;inFlight=true;try{const result=await api('/api/session','POST',{pin:entryCode,creatureId:id});if(visit!==visitEpoch)return;if(result.creatureId!==id||typeof result.token!=='string'||!result.token)throw Error('Invalid session');accessToken=result.token;session=id;entryCode='';await refreshOffers();if(visit===visitEpoch)go('home')}catch(e){problem(e)}finally{inFlight=false}}
function go(r){close();teacher=false;route=r;render();window.scrollTo(0,0);if(r==='requests'&&accessToken)refreshOffers().then(()=>{if(route==='requests')renderRequests()}).catch(problem)}
function badge(){$('#identityBadge').innerHTML=session?`<div class="identity">${img(avatar(session),creature(session).creature)}<span><small>That's me!</small><strong>${esc(creature(session).creature)}</strong></span></div>`:''}
function render(){if(!baseline)return;badge();document.body.classList.toggle('offers-page',route==='requests'&&!!session);if(!session)return chooseIdentity();if(route==='home')home();else if(route==='shop')renderShop();else if(route==='requests')renderRequests();else if(teacher)handoff();else go('home')}
function chooseIdentity(){$('#app').innerHTML=`<div class="welcome"><p class="eyebrow">Your adventure starts here</p><h1>Which creature are you?</h1><p>Find your creature, then explore the shops!</p></div><div class="grid">${baseline.creatures.map(c=>`<button class="shop" data-action="pickIdentity" data-id="${esc(c.id)}"><div class="portrait">${img(avatar(c.id),c.creature)}</div><div class="cardbody"><h3>${esc(c.creature)}</h3></div></button>`).join('')}</div>`}
function confirmIdentity(id){if(session)return;dialog('Is this your creature?',`<div class="identity-art">${img(avatar(id),creature(id).creature)}</div><h3 class="center">${esc(creature(id).creature)}</h3><p class="honesty">Only choose your own creature. Being honest keeps the market fair and fun for everyone!</p><div class="bigchoices"><button data-action="confirmIdentity" data-id="${esc(id)}">Yes, that's me!</button><button class="soft" data-action="close">No, let me choose again</button></div>`)}
function home(){$('#app').innerHTML=`<div class="welcome"><p class="eyebrow">Little treasures. Brilliant trades.</p><h1>Let's explore!</h1><p>Visit a creature's collection and find a Squishy you love.</p>${marketOpen?'':'<p class="honesty">The market is resting while your teacher checks the offers. You can still have a look!</p>'}</div><div class="grid">${baseline.creatures.map(c=>`<button class="shop" data-action="shop" data-id="${esc(c.id)}"><div class="portrait">${img(avatar(c.id),c.creature)}</div><div class="cardbody"><h3>${esc(c.creature)}</h3><span class="small muted">${c.id===session?'Your collection · ':''}${baseline.items.filter(i=>i.owner===c.id).length} Squishies</span></div></button>`).join('')}</div>`}
function renderShop(){const c=creature(shop);if(!c)return go('home');$('#app').innerHTML=`<button class="soft" data-go="home">← All shops</button><div class="shopheading">${img(avatar(shop),c.creature)}<div><p class="eyebrow">${shop===session?'Your treasures':"Come and have a look"}</p><h1>${esc(c.creature)}</h1></div></div><div class="items">${baseline.items.filter(i=>i.owner===shop).map(i=>`<button class="item" data-action="squishy" data-id="${esc(i.id)}">${img(art(i),label(i))}<h3>${esc(label(i))}</h3>${rarityBadge(i)}<span class="item-hint">${shop===session?'Your Squishy':'Take a closer look →'}</span></button>`).join('')||'<p>No Squishies here yet. Come back soon!</p>'}</div>`}
function squishy(id){const i=item(id);if(!marketOpen&&i.owner!==session){dialog('The market is resting',`<div class="decision-art">${img(art(i),label(i))}</div><p>Your teacher is checking the offers. Come back soon to make a new one!</p><button data-action="close">Okay!</button>`);return}if(i.owner===session){dialog(label(i),`${rarityBadge(i)}<div class="identity-art">${img(art(i),label(i))}</div><p class="center">One of your lovely Squishies! Visit another shop to offer a trade.</p><button class="wide" data-action="close">Lovely!</button>`);return}dialog('Make an offer',`<div class="decision-art">${img(art(i),label(i))}</div><h3 class="center">${esc(label(i))}</h3>${rarityBadge(i)}<div class="bigchoices"><button data-action="jd" data-id="${esc(id)}">Offer JD</button><button class="gold" data-action="swap" data-id="${esc(id)}">Trade my Squishy</button></div>`)}
function jd(id){const b=creature(session).balance;dialog('How much JD will you offer?',`<div class="decision-art">${img(art(item(id)),label(item(id)))}</div><p class="center">You have <strong>${money(b)}</strong></p><label for="offerAmount">Your offer (JD)</label><input id="offerAmount" type="number" min="0.01" max="${Math.min(b/100,999.99)}" step="0.01" inputmode="decimal" placeholder="0.00"><div class="bigchoices"><button data-action="reviewJD" data-id="${esc(id)}" ${b<1?'disabled':''}>Review my offer</button></div>`)}
function readAmount(){const v=$('#offerAmount').value.trim();if(!/^\d{1,3}(\.\d{1,2})?$/.test(v))throw Error('Invalid amount');const p=Math.round(Number(v)*100);if(p<1||p>creature(session).balance||p>99999){$('#dialogError').textContent='Choose an amount you have, from 0.01 JD.';return null}return p}
function swap(id){const t=item(id);if(baseline.items.some(i=>i.owner===session&&i.type===t.type)){dialog('You already have this Squishy',`<p>Try choosing a different Squishy for your collection.</p><button data-action="close">Okay!</button>`);return}const own=baseline.items.filter(i=>i.owner===session&&!baseline.items.some(j=>j.owner===t.owner&&j.type===i.type));dialog('Which Squishy will you offer?',`<p class="center">Choose one of yours to trade for <strong>${esc(label(t))}</strong>.</p>${rarityBadge(t)}<div class="choices">${own.map(i=>`<button class="choice" data-action="reviewSwap" data-id="${esc(i.id)}" data-target="${esc(id)}">${img(art(i),label(i))}<strong>${esc(label(i))}</strong>${rarityBadge(i)}</button>`).join('')}</div>${own.length?'':'<p>There is no matching swap available. Try another shop!</p>'}`)}
function review(id,kind,offered=null,amount=null){const t=item(id),o=item(offered);dialog('Ready to send?',`<div class="review-pair"><div class="review-side">${kind==='swap'?img(art(o),label(o)):'<span class="coin-art">✦</span>'}<p>You offer</p><strong>${kind==='swap'?esc(label(o)):money(amount)}</strong>${kind==='swap'?rarityBadge(o):''}</div><span class="trade-arrow">↔</span><div class="review-side">${img(art(t),label(t))}<p>You would like</p><strong>${esc(label(t))}</strong>${rarityBadge(t)}</div></div><p class="honesty">Your teacher checks every offer before a trade happens.</p><div class="bigchoices"><button data-action="submit" data-target="${esc(id)}" data-kind="${kind}" data-id="${esc(offered||'')}" data-amount="${amount??''}">Send my offer</button><button class="soft" data-action="close">Not yet</button></div>`)}
async function submit(target,kind,offered,amount){if(inFlight)return;const visit=visitEpoch;inFlight=true;try{if(!session||!marketOpen)throw Error('Market closed');const signature=JSON.stringify([session,target,kind,offered||null,amount,baseline.revision]);const r=pendingRequest?.signature===signature?pendingRequest.request:E.request(baseline,session,target,kind,offered||null,kind==='buy'?Number(amount):null);pendingRequest={signature,request:r};const result=await api('/api/offers','POST',{classId:baseline.classId,baseRevision:baseline.revision,epoch,request:r});if(visit!==visitEpoch)return;if(result.status!=='pending'||result.request?.id!==r.id)throw Error('Offer not confirmed');pendingRequest=null;if(!requests.some(x=>x.id===result.request.id))requests.push(result.request);offerMeta.set(result.request.id,{status:'pending',exported:false});go('requests');toast('Your offer has been sent to your teacher!')}catch(e){problem(e)}finally{inFlight=false}}
async function withdraw(id){if(inFlight)return;const r=requests.find(x=>x.id===id);if(!r||r.buyer!==session||!marketOpen||offerMeta.get(id)?.exported)return;inFlight=true;try{const result=await api('/api/offers/'+encodeURIComponent(id)+'/withdraw','POST',{classId:baseline.classId});if(result.id!==id||result.status!=='withdrawn')throw Error('Withdrawal not confirmed');offerMeta.set(id,{status:'withdrawn',exported:false});go('requests');toast('Your offer has been removed.')}catch(e){problem(e)}finally{inFlight=false}}
function renderRequests(){const rs=requests.filter(r=>r.buyer===session);$('#app').innerHTML=`<div class="welcome"><p class="eyebrow">Your little collection of possibilities</p><h1>My offers</h1><p>${marketOpen?'Take a look at your offers. Changed your mind? You can remove a waiting offer.':'Your teacher is checking the offers. They cannot be changed right now.'}</p></div>${rs.map(r=>`<article class="offer"><div class="row spread"><div class="offer-heading"><h3>${esc(label(item(r.targetId)))}</h3>${rarityBadge(item(r.targetId))}</div><span class="status">${{pending:'Waiting for teacher',approved:'Trade approved!',denied:'Not this time',stale:'Please choose again',withdrawn:'Removed'}[status(r)]}</span></div><div class="offerline">${img(art(item(r.targetId)),label(item(r.targetId)))}<p>You offered <strong>${r.kind==='buy'?money(r.price):esc(label(item(r.offeredId)))}</strong>${r.kind==='swap'?rarityBadge(item(r.offeredId)):'<br>'}to ${esc(creature(r.seller)?.creature||'another creature')}</p></div>${status(r)==='pending'&&marketOpen&&!offerMeta.get(r.id)?.exported?`<button class="soft" data-action="withdraw" data-id="${esc(r.id)}">Remove this offer</button>`:''}</article>`).join('')||'<section class="panel empty"><h2>No offers yet</h2><p>A Squishy adventure is waiting for you!</p><button data-go="home">Explore the shops</button></section>'}`}
function teacherGate(){dialog('Teacher tools',`<p>Enter the market code to open teacher controls.</p><label for="teacherPin">Teacher code</label><input id="teacherPin" type="password" inputmode="numeric" maxlength="5" autocomplete="off"><div class="bigchoices"><button data-action="unlockTeacher">Open teacher tools</button></div>`)}
function handoff(){$('#app').innerHTML=`<h1>Teacher tools</h1><section class="panel"><h3>Shared market inbox</h3><p>Open the teacher dashboard to close or reopen the market, collect the whole class's offers, and refresh results. Your owner account protects these controls.</p><a class="teacher-link" href="${esc(service.teacherUrl)}" target="_blank" rel="noopener">Open teacher dashboard ↗</a></section>${legacyRequests.length||Object.keys(drafts).length?'<section class="panel"><h3>Earlier device records</h3><p>Older local offers have been kept unchanged. Download a backup before migrating or reviewing them.</p><button data-action="legacyBackup">Download earlier records</button></section>':''}<button class="soft" data-action="leaveTeacher">Close teacher tools</button>`}
function legacyBackup(){if(!teacher)return;const raw=localStorage.getItem(KEY);if(!raw)return;const url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Earlier-Market-Device-Records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function newVisit(){visitEpoch++;close();session=null;accessToken=null;entryCode='';pendingRequest=null;teacher=false;route='home';$('#marketShell').hidden=true;$('#entryGate').hidden=false;$('#entryPin').value='';document.body.classList.remove('offers-page')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.go)return go(b.dataset.go);const a=b.dataset.action,id=b.dataset.id,t=b.dataset.target;if(a==='close')close();else if(a==='retry')load();else if(a==='pickIdentity'&&!session)confirmIdentity(id);else if(a==='confirmIdentity'&&!session&&creature(id))enterIdentity(id);else if(a==='teacher')teacherGate();else if(a==='unlockTeacher'){if($('#teacherPin').value!=='37268'){$('#dialogError').textContent='That code is not correct.';$('#teacherPin').value='';return}close();teacher=true;route='teacher';handoff()}else if(a==='leaveTeacher')go('home');else if(a==='shop'&&session){shop=id;go('shop')}else if(a==='squishy'&&session)squishy(id);else if(a==='jd'&&session)jd(id);else if(a==='swap'&&session)swap(id);else if(a==='reviewJD'){const p=readAmount();if(p!==null)review(id,'buy',null,p)}else if(a==='reviewSwap')review(t,'swap',id);else if(a==='submit')submit(t,b.dataset.kind,id,b.dataset.amount);else if(a==='withdraw'){const r=requests.find(x=>x.id===id);if(r&&r.buyer===session&&status(r)==='pending'&&marketOpen&&!offerMeta.get(r.id)?.exported){dialog('Remove this offer?',`<p>You can make a new offer whenever you like.</p><div class="bigchoices"><button data-action="confirmWithdraw" data-id="${esc(id)}">Yes, remove it</button><button class="soft" data-action="close">Keep my offer</button></div>`)}}else if(a==='confirmWithdraw')withdraw(id);else if(a==='legacyBackup'&&teacher)legacyBackup()}catch(e){problem(e)}});
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();if($('#entryPin').value!=='37268'){$('#entryError').textContent='Try that code again.';$('#entryPin').value='';return}entryCode=$('#entryPin').value;$('#entryPin').value='';$('#entryError').textContent='';$('#entryGate').hidden=true;$('#marketShell').hidden=false;$('#app').innerHTML='<p>Opening the shops…</p>';if(baseline)render();else load()});window.addEventListener('pageshow',e=>{if(e.persisted)newVisit()});
</script></body></html>
