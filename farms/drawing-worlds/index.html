<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d32"><title>Living Farms · Food & Fibre</title><link rel="stylesheet" href="worlds.css"><script src="designs.js" defer></script><script src="worlds.js" defer></script></head><body><main class="app"><header><a class="back" href="/#student-games">← Vandawoods</a><div><p class="eyebrow">IDEAS FROM THE LAND</p><h1>Living farms</h1></div><button id="collection" aria-expanded="false" aria-controls="farm-list">Choose a farm <span>↗</span></button></header><nav id="farm-list" class="farm-list" aria-label="Choose a farm" hidden></nav><section class="world"><div class="scene-title"><div><span class="eyebrow" id="season-kicker">AUTUMN</span><h2 id="farm-title">Farm 01</h2></div><button id="labels" aria-pressed="true">Labels on</button></div><div class="canvas-wrap"><canvas id="scene" width="1500" height="960" role="img" aria-label="Animated farm. Select a feature below to discover what it does."></canvas><div class="scene-caption" id="caption"></div></div><div class="transport"><span class="eyebrow">FROM FARM TO EVERYDAY LIFE</span><div id="products"></div></div></section><aside class="details"><div class="detail-top"><p class="eyebrow">LOOK CLOSER</p><h2 id="feature-title">A farm in motion</h2><p id="feature-text">Choose a feature to follow its story.</p></div><div id="features" class="features" aria-label="Farm features"></div><div class="season-story"><p class="eyebrow" id="season-label">AUTUMN</p><p id="season-description"></p></div></aside><footer><button id="play" class="primary" aria-pressed="true">Pause</button><div class="seasons" aria-label="Season"><button data-season="0">Autumn</button><button data-season="1">Winter</button><button data-season="2">Spring</button><button data-season="3">Summer</button></div><label class="pace">Pace<select id="pace"><option value="24">Gentle</option><option value="12">Quick</option><option value="45">Slow</option></select></label><button id="restart" aria-label="Restart the year">↺</button><div class="progress" aria-label="Year progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="progress"></i></div></footer><p class="small-note">Inspired by our farm designs. Animation shows ideas in action, not measured yields.</p><p class="sr-only" id="announce" aria-live="polite"></p></main></body></html>
