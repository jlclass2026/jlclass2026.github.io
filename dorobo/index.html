<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#251b18"><title>Dorobō · Detective desk</title><link rel="stylesheet" href="desk.css?v=2"><script src="desk.js?v=2" defer></script></head>
<body>
<div class="desk photo" aria-hidden="true"><div class="lamp-glow"></div><div class="evidence"><span>CASE NOTES</span><i></i><i></i><i></i></div><div class="pencil"></div><div class="magnifier"></div><div class="coffee"></div><div class="paperclip"></div></div>
<main>
<section id="lock-screen" class="lock-screen" aria-labelledby="lock-title">
<form id="unlock-form" class="case-folder"><span class="eyebrow">DINO BYTES · DETECTIVE FILES</span><div class="seal" aria-hidden="true">⌕</div><h1 id="lock-title">Dorobō</h1><p>Every clue counts.</p><label for="pin">Enter the classroom PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-describedby="unlock-error"><button id="unlock" type="submit">Open the casebook <span aria-hidden="true">→</span></button><p id="unlock-error" class="message" role="status"></p><a class="back" href="/#class-games">← Class Games</a></form>
</section>
<section id="reader" class="reader" hidden aria-label="Detective casebook">
<div class="book-wrap" id="book-wrap"><img id="case-image" alt="" draggable="false"><div id="interactive-layer" class="interactive-layer" aria-label="Make your deductions"></div><p id="board-hint" class="board-hint">Hint: make this grid on your whiteboard</p></div>
<nav class="toolbar" aria-label="Casebook controls"><a href="/#class-games" title="Class Games" aria-label="Back to Class Games">⌂</a><span class="divider"></span><button id="previous" aria-label="Previous case" title="Previous case">←</button><span id="case-label" class="case-label" aria-live="polite"></span><button id="next" aria-label="Next case" title="Next case">→</button><span class="divider"></span><button id="check" title="Check your accusation (Enter)">Check ↵</button><button id="reset" title="Clear this case">Reset</button><button id="zoom" aria-pressed="false" title="Enlarge for reading">Zoom</button><button id="fullscreen" title="Full screen">⛶</button><button id="lock" title="Lock casebook">Lock</button></nav><div id="feedback" class="feedback" role="status" hidden></div><div id="solved" class="solved" role="dialog" aria-modal="true" aria-labelledby="solved-title" hidden><div class="solved-card"><span class="solved-stamp">CASE CLOSED</span><h2 id="solved-title">SOLVED!</h2><p id="solved-detail"></p><button id="continue">Back to casebook</button></div></div><p id="reader-error" class="reader-error" role="alert"></p>
</section>
</main></body></html>
