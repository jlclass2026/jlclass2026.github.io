<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#251b18"><title>Dorobō · Detective desk</title><link rel="stylesheet" href="desk.css?v=3-cases"><script src="release.js?v=3-illustrated" defer></script><script src="desk.js?v=7-illustrated" defer></script></head>
<body>
<div class="desk photo" aria-hidden="true"><div class="lamp-glow"></div><div class="evidence"><span>CASE NOTES</span><i></i><i></i><i></i></div><div class="pencil"></div><div class="magnifier"></div><div class="coffee"></div><div class="paperclip"></div></div>
<main>
<section id="reader" class="reader" aria-label="Detective casebook">
<div class="book-wrap" id="book-wrap"><img id="case-image" alt="" draggable="false"><div id="interactive-layer" class="interactive-layer" aria-label="Make your deductions"></div><p id="board-hint" class="board-hint">Hint: make this grid on your whiteboard</p></div>
<nav class="toolbar" aria-label="Casebook controls"><a href="/#class-games" title="Class Games" aria-label="Back to Class Games">⌂</a><span class="divider"></span><button id="previous" aria-label="Previous case" title="Previous case">←</button><span id="case-label" class="case-label" aria-live="polite"></span><select id="case-picker" aria-label="Choose a case"></select><button id="next" aria-label="Next case" title="Next case">→</button><span class="divider"></span><button id="check" title="Check your accusation (Enter)">Check ↵</button><button id="reset" title="Clear this case">Reset</button><button id="zoom" aria-pressed="false" title="Enlarge for reading">Zoom</button><button id="fullscreen" title="Full screen">⛶</button></nav><div id="feedback" class="feedback" role="status" hidden></div><div id="solved" class="solved" role="dialog" aria-modal="true" aria-labelledby="solved-title" hidden><div class="solved-card"><span class="solved-stamp">CASE CLOSED</span><h2 id="solved-title">SOLVED!</h2><p id="solved-detail"></p><button id="continue">Back to casebook</button></div></div><p id="reader-error" class="reader-error" role="alert"></p>
</section>
</main></body></html>
