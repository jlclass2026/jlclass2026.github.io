 <text x="115" y="83" font-size="24" fill="#643f65" font-weight="bold">D O R O B Ō   •   C A S E   05</text>
 <text x="115" y="155" font-size="51" font-weight="bold">The Silent Rehearsal</text>
 <path d="M115 183H766M906 367H1580" stroke="#643f65" stroke-opacity=".65"/>
 <text x="115" y="224" font-size="21" >The Whisper Fox vanished from the music room during rehearsal.</text><text x="115" y="249" font-size="21" >Each suspect visited a different room and carried a different</text><text x="115" y="274" font-size="21" >container. The suspect who visited the music room is the thief.</text>
