 <text x="905" y="106" font-size="43" font-weight="bold">Evidence log</text><text x="910" y="163" font-size="20" >1.  The map tube was spotted in the gym.</text><text x="910" y="214" font-size="20" >2.  The tool bag was not in the music room.</text><text x="910" y="265" font-size="20" >3.  Dark Side of the Moon carried neither the map tube nor</text><text x="943" y="287" font-size="20" >the glove box.</text><text x="910" y="316" font-size="20" >4.  Check Mate didn’t visit the gym.</text>
