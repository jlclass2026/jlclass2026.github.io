<svg xmlns="http://www.w3.org/2000/svg" width="1671" height="941" viewBox="0 0 1671 941"><defs><linearGradient id="paper"><stop stop-color="#ebd2a3"/><stop offset=".07" stop-color="#fbebcc"/><stop offset=".48" stop-color="#f8e7c9"/><stop offset=".5" stop-color="#c9ad82"/><stop offset=".519" stop-color="#f5e5c5"/><stop offset=".97" stop-color="#f9e8c8"/><stop offset="1" stop-color="#dfc39d"/></linearGradient><pattern id="flecks" width="19" height="21" patternUnits="userSpaceOnUse"><path d="M1 4h1m7 10h2m5 3h1" stroke="#76522f" stroke-opacity=".15"/></pattern></defs><rect width="1671" height="941" rx="23" fill="url(#paper)"/><rect width="1671" height="941" rx="23" fill="url(#flecks)" opacity=".38"/><g fill="#342a22" font-family="Georgia, serif">
 <text x="115" y="83" font-size="24" fill="#23595b" font-weight="bold">D O R O B Ō   •   C A S E   04</text>
 <text x="115" y="155" font-size="44" font-weight="bold">The Lantern That Went Dark</text>
 <path d="M115 183H766M906 367H1580" stroke="#23595b" stroke-opacity=".65"/>
 <text x="115" y="217" font-size="21" >The Glow Moth vanished when the harbour lights went out.</text><text x="115" y="242" font-size="21" >The log lists the visits in order: Lighthouse, Pier, Boathouse.</text><text x="115" y="267" font-size="21" >The thief made the last visit. Each suspect visited a different</text><text x="115" y="292" font-size="21" >place and carried a different container.</text>
 <text x="117" y="323" font-size="22" font-weight="bold" fill="#23595b">Suspects</text><text x="117" y="475" font-size="22" font-weight="bold" fill="#23595b">Containers</text><text x="117" y="627" font-size="22" font-weight="bold" fill="#23595b">Locations</text>
 <rect x="117" y="336" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="220.5" y="380" font-size="37" text-anchor="middle" fill="#23595b">♛</text><text x="220.5" y="412" font-size="22" text-anchor="middle" font-weight="bold">Lady Scorn</text><rect x="338" y="336" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="441.5" y="380" font-size="37" text-anchor="middle" fill="#23595b">◈</text><text x="441.5" y="412" font-size="22" text-anchor="middle" font-weight="bold">Boulder Wolf</text><rect x="559" y="336" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="662.5" y="380" font-size="37" text-anchor="middle" fill="#23595b">◌</text><text x="662.5" y="412" font-size="22" text-anchor="middle" font-weight="bold">Bad Bubbles</text><rect x="117" y="488" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="220.5" y="532" font-size="37" text-anchor="middle" fill="#23595b">▣</text><text x="220.5" y="564" font-size="22" text-anchor="middle" font-weight="bold">Tin trunk</text><rect x="338" y="488" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="441.5" y="532" font-size="37" text-anchor="middle" fill="#23595b">▰</text><text x="441.5" y="564" font-size="22" text-anchor="middle" font-weight="bold">Canvas satchel</text><rect x="559" y="488" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="662.5" y="532" font-size="37" text-anchor="middle" fill="#23595b">▤</text><text x="662.5" y="564" font-size="22" text-anchor="middle" font-weight="bold">Picnic hamper</text><rect x="117" y="640" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="220.5" y="684" font-size="37" text-anchor="middle" fill="#23595b">♜</text><text x="220.5" y="716" font-size="22" text-anchor="middle" font-weight="bold">Lighthouse</text><rect x="338" y="640" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="441.5" y="684" font-size="37" text-anchor="middle" fill="#23595b">═</text><text x="441.5" y="716" font-size="22" text-anchor="middle" font-weight="bold">Pier</text><rect x="559" y="640" width="207" height="98" rx="7" fill="#23595b" fill-opacity=".055" stroke="#23595b" stroke-opacity=".55"/><text x="662.5" y="684" font-size="37" text-anchor="middle" fill="#23595b">⌂</text><text x="662.5" y="716" font-size="22" text-anchor="middle" font-weight="bold">Boathouse</text><text x="117" y="795" font-size="23" font-weight="bold" fill="#23595b">WHO STOLE THE GLOW MOTH?</text>
 <text x="117" y="840" font-size="20" >Suspect</text><path d="M280 845H756" stroke="#9b7b58"/><text x="117" y="876" font-size="20" >Container</text><path d="M280 881H756" stroke="#9b7b58"/><text x="117" y="912" font-size="20" >Location</text><path d="M280 917H756" stroke="#9b7b58"/>
 <text x="905" y="106" font-size="43" font-weight="bold">Evidence log</text><text x="910" y="163" font-size="20" >1.  Lady Scorn’s visit came before the one with the canvas satchel.</text><text x="910" y="214" font-size="20" >2.  The tin trunk’s visit came before Boulder Wolf’s.</text><text x="910" y="265" font-size="20" >3.  The tin trunk was not at the lighthouse.</text><text x="910" y="316" font-size="20" >4.  Exactly one is true: Bad Bubbles visited later than Lady Scorn</text><text x="943" y="338" font-size="20" >OR Bad Bubbles carried the canvas satchel. Not both.</text>
